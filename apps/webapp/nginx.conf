# webapp 컨테이너 내부 nginx — 정적 앱 셸만 서빙(엣지 nginx 뒤에 위치).
# /api 는 엣지에서 gateway 로 라우팅되므로 여기엔 오지 않는다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 서비스워커·매니페스트는 항상 최신으로(오래 캐시하면 SW 갱신이 지연됨).
    location = /sw.js            { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # 해시된 정적 에셋은 장기 캐시.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # SPA 폴백.
    location / { try_files $uri $uri/ /index.html; }
}
