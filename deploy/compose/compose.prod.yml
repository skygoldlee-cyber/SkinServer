# =============================================================
# compose.prod.yml — 운영(VPS) 오버레이
#   로컬 db 를 두지 않는다(= base 서비스만). DATABASE_URL 은
#   deploy/env/.env 에서 Supabase 엔드포인트로 지정한다.
#   HTTPS 는 compose.tls.yml(Caddy) 를 함께 얹는다.
#
# 사용:
#   docker compose -f deploy/compose/compose.base.yml \
#                  -f deploy/compose/compose.prod.yml \
#                  -f deploy/compose/compose.tls.yml \
#                  --env-file deploy/env/.env --env-file deploy/env/.env.images up -d
# =============================================================
services:
  gateway:
    pull_policy: always
    environment:
      ENV: prod                    # fail-fast(ENV=prod 에서 AUTH_MODE!=strict 면 기동 거부) 활성화
      AUTH_MODE: strict            # 운영: 검증된 상류가 주입한 X-User-Id 필수(없으면 401)
      STORAGE_BACKEND: supabase
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-skin-images}
      # AUTO_DDL 미설정(off) — 스키마는 deploy/db/migrations 로 적용
  worker:
    pull_policy: always
    environment:
      ENV: prod
      STORAGE_BACKEND: supabase
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-skin-images}
  engine-analysis:
    pull_policy: always
    environment:
      ENV: prod
  engine-prescription:
    pull_policy: always
    environment:
      # (P1 #5) rules.py 가 ENV=prod 에서 example config fallback 을 fail-fast 차단.
      ENV: prod
