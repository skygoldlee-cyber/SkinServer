# =============================================================
# nginx-log-privacy.conf — 접근 로그 개인정보 최소화 (①)
#
#  기본 nginx 로그($request)는 쿼리스트링을 통째로 남긴다 → presigned ?token=…
#  이미지 URL·토큰이 디스크에 기록됨. 아래 포맷은 쿼리스트링/인증헤더/쿠키를
#  로그에서 제외한다($request 대신 $uri 사용).
#
#  배치: 05_CD_배포/skinlens-ops/nginx/conf.d/ 에 두면 00-hardening 처럼 http 컨텍스트에 로드됨.
#  적용: 각 server 블록 또는 http 기본에서  access_log … privacy;  로 지정.
# =============================================================

# 쿼리스트링/토큰/쿠키 없이: method + 경로(args 제외) + 상태 + 크기 + 처리시간
log_format privacy escape=json
  '{'
    '"ts":"$time_iso8601",'
    '"ip":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'                 # ★ $request/$request_uri 가 아니라 $uri (args 제외)
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"rt":$request_time,'
    '"ua":"$http_user_agent"'
  '}';

# 전역 기본을 privacy 로. 개별 server 에서 재지정 가능.
access_log /var/log/nginx/access.log privacy;

# 참고: Authorization 헤더·쿠키·$args 는 어떤 로그 포맷에도 넣지 말 것.
#       업로드 바디는 절대 로깅 금지(access/error 모두).
