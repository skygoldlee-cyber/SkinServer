# API 게이트웨이 — 앱·엔진 콜백. 업로드 크기 + 타임아웃 튜닝.
server {
    listen 80;
    server_name api.example.com api.localhost;

    # 이미지 업로드 대비 (기본 1m → 413 방지). 엔드포인트 크기에 맞춰 조정.
    client_max_body_size 25m;

    include /etc/nginx/snippets/security-headers.conf;   # (v3)

    # (P0-TLS) 업로드 전용 강한 제한 — 실제 업로드 경로로 교체해 활성화.
    #   예: presigned 발급/직접 업로드 엔드포인트. 존은 00-hardening.conf 의 upload.
    # location /v1/uploads {
    #     limit_req zone=upload burst=5 nodelay;
    #     proxy_pass http://gateway:8000;
    #     include /etc/nginx/snippets/proxy-common.conf;
    #     proxy_connect_timeout 5s;
    #     proxy_send_timeout    120s;
    #     proxy_read_timeout    120s;
    # }

    # (활성) 업로드 전용 강한 rate-limit — 스토리지 남용/디스크 채우기 방지.
    location = /analyze {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 25m;
        proxy_pass http://gateway:8000;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location / {
        limit_req zone=api burst=20 nodelay;             # (v3) 00-hardening.conf 의 존 소비
        proxy_pass http://gateway:8000;
        include /etc/nginx/snippets/proxy-common.conf;

        # 동기 폴백 경로 안전판(정답은 비동기 Job — 부록 C). 기본 60s → 504 방지.
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
