# PWA 앱 표면 — app.example.com. /=정적 앱 셸(webapp), /api/=gateway (같은 오리진 → CORS 불필요).
server {
    listen 80;
    server_name app.example.com app.localhost;

    client_max_body_size 25m;                            # /api/analyze 업로드 대비
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-app.conf;            # (P0) PWA 전용 CSP(Supabase 오리진 허용)

    # 업로드 전용 강한 rate-limit + 타임아웃(api.conf 와 동일 존/튜닝).
    location = /api/analyze {
        limit_req zone=upload burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://gateway:8000;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # 그 외 API — /api 접두어를 떼고 gateway 로.
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://gateway:8000;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # 정적 PWA(앱 셸). SW/매니페스트 캐시 정책은 webapp 컨테이너 nginx 가 처리.
    location / {
        proxy_pass http://webapp:80;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
