# 공개 홈페이지 — 기본 서버(호스트 미지정 요청도 여기로)
server {
    listen 80 default_server;
    server_name www.example.com example.com www.localhost localhost _;

    include /etc/nginx/snippets/security-headers.conf;   # (v3)

    location / {
        proxy_pass http://homepage:80;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
