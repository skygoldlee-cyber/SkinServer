# 개발자 페이지 — 공개 대상 아님: Basic Auth + (선택) IP 허용
server {
    listen 80;
    server_name dev.example.com dev.localhost;

    # README 의 htpasswd 로 nginx/.htpasswd 생성 후 활성 상태
    auth_basic           "SkinLens Dev";
    auth_basic_user_file /etc/nginx/.htpasswd;

    include /etc/nginx/snippets/security-headers.conf;   # (v3)

    # 특정 IP 만 허용하려면 아래 두 줄 주석 해제 후 대역 지정
    # allow 203.0.113.0/24;
    # deny  all;

    # (dev 점검 편의) 콘솔이 same-origin 으로 gateway 를 호출하도록 /api → gateway.
    #  운영에서는 두지 않는다(공개 API 는 별도 api vhost). Basic Auth 뒤라 보호됨.
    location /api/ {
        proxy_pass http://gateway:8000/;
        include /etc/nginx/snippets/proxy-common.conf;
        client_max_body_size 25m;
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location / {
        proxy_pass http://devpage:80;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
