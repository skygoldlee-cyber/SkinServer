# (v3) http 컨텍스트 하드닝 — conf.d/ 는 http 블록 안에 include 되므로
#      server_tokens·limit_req_zone 같은 http 레벨 지시어를 여기에 둔다.
#      파일명 00- 접두사로 다른 server 블록보다 먼저 로드되게 한다.

# 응답/에러 페이지에서 nginx 버전 숨김 (핑거프린팅 표면 축소)
server_tokens off;

# (P0 #2) 실제 클라이언트 IP 복원 — 운영에서 nginx 앞엔 Caddy(compose.tls.yml)가 있고,
#          Caddy 가 X-Forwarded-For 에 실제 IP 를 넣어 본다(Caddyfile header_up).
#          복원하지 않으면 모든 요청의 $remote_addr 가 Caddy IP 로 기록돼
#          limit_req_zone(아래)이 프록시 단일 IP 기준으로 묶여 rate limit 이 물리화된다.
#  신뢰 대역은 RFC1918 + CGNAT(도커 사설망)으로 한정 — 공인 IP 로의 우회/스푸핑 차단.
#  real_ip_recursive on: XFF 체인에서 "마지막 비신뢰 주소" 를 실제 IP 로 채택.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 100.64.0.0/10;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# API 레이트리밋 존 (IP 기준). 각 server 의 location 에서 limit_req 로 소비.
#  - 10m ≈ 약 16만 IP 상태, 평균 10 req/s 로 제한.
#  - 위 real_ip 설정 덕에 $binary_remote_addr 는 "복원된 실제 클라이언트 IP".
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# (P0-TLS) 업로드 전용 강한 존 — 스토리지 채우기 남용 방지(1 req/s, IP 기준).
limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/s;

# (P0-TLS) 프로토콜 정규화 — Caddy 뒤(운영)면 X-Forwarded-Proto=https 를 신뢰,
#          직결(스테이징)이면 $scheme(http) 사용. gateway 가 올바른 proto 를 받음.
#  ※ 운영에선 nginx 로 들어오는 경로가 Caddy 뿐이라 XFP 신뢰가 안전.
#    스테이징은 개발 전용이라 스푸핑 위험을 감수(필요 시 set_real_ip_from 로 강화).
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    https   https;
    http    http;
}
