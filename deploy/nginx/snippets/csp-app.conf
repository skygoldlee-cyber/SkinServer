# (P0) app.(PWA) 표면 전용 Content-Security-Policy — app.conf 에서만 include.
#   · 앱 셸/스크립트/워커/매니페스트는 same-origin('self').
#   · connect-src: 같은 오리진 /api(gateway) + Supabase(auth/realtime) 직접 호출 허용.
#   · www/dev/api 와 요구사항이 달라 공통 security-headers 가 아니라 여기서만 적용한다.
#   ★ 배포 전 필수: <PROJECT> 를 실제 Supabase 프로젝트 서브도메인으로 교체
#     (예: connect-src ... https://abcdefgh.supabase.co wss://abcdefgh.supabase.co).
#   style-src 의 'unsafe-inline' 은 실무 기본값 — 인라인 스타일을 없애면 제거 가능.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'; manifest-src 'self'; connect-src 'self' https://<PROJECT>.supabase.co wss://<PROJECT>.supabase.co; form-action 'self'" always;
