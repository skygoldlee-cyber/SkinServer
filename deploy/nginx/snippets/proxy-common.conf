# 공통 프록시 헤더 — 각 upstream location 에서 include
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $client_proto;   # (P0-TLS) 00-hardening.conf 의 map 소비
# (P0-AUTH) 클라이언트가 보낸 X-User-Id 위조 차단 — 엣지에서 항상 제거.
#   운영 인증은 gateway 가 Authorization: Bearer(JWT)를 검증해 사용자 신원을 도출한다.
#   (Authorization 헤더는 그대로 통과)
proxy_set_header X-User-Id         "";
proxy_http_version 1.1;
proxy_set_header Connection "";
